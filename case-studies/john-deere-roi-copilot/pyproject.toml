[project]
name = "deere-roi-copilot"
version = "0.1.0"
description = "Equipment investment decision engine for precision-ag ROI under uncertainty"
requires-python = ">=3.11"

# Runtime only — what ships in the API container. Kept lean deliberately:
# polars/matplotlib are offline-only and live in the `etl` extra.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Offline: ETL, model training, figure generation. Never imported at request time.
etl = ["polars>=1.9", "requests>=2.32", "matplotlib>=3.9", "pyarrow>=17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
